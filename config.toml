# Deterministic pipeline configuration. Adding a competitor or source is a
# config change, not a code change.

# Pinned model IDs, never "latest" (MODEL-GOVERNANCE.md). Values mirror the
# LLMConfig defaults in ci_tool/models.py; provider swap is a one-line edit.
[llm]
provider = "groq"
groq_model = "openai/gpt-oss-120b"
gemini_model = "gemini-2.5-flash"

[settings]
recency_days = 14
cluster_window_days = 90
# replay recency window anchors here (the eval sample's frozen NOW), so a
# rebuilt db reproduces the documented state on any date; live uses the clock
replay_anchor = "2026-08-14T10:20:35Z"
raw_dir = "data/raw"
db_path = "data/ci.db"

# trust_tier: 1 = vendor's own words (blog/changelog/releases),
#             2 = official platform changelogs, 3 = third-party news.
# Tier 1-2 feeds pass relevance by construction (the whole feed is on-topic);
# tier 3 items must match a tracked entity alias.

[[competitors]]
id = "jfrog"
name = "JFrog"
# ourselves; tracked so the digest shows our own announcements too
aliases = ["jfrog", "artifactory", "xray", "apptrust", "jfrog fly"]

[[competitors]]
id = "sonatype"
name = "Sonatype"
aliases = ["sonatype", "nexus repository", "nexus lifecycle", "nexus firewall"]

[[competitors]]
id = "cloudsmith"
name = "Cloudsmith"
aliases = ["cloudsmith"]

[[competitors]]
id = "github"
name = "GitHub"
aliases = ["github packages", "github artifact", "github advanced security", "dependabot"]

[[competitors]]
id = "gitlab"
name = "GitLab"
aliases = ["gitlab"]

[[competitors]]
id = "snyk"
name = "Snyk"
# "evo" is Snyk's product brand; the 2026-08-14 eval measured relevant Evo
# posts slipping past a company-name-only gate (EVALUATION.md, gate misses)
aliases = ["snyk", "evo"]

[[competitors]]
id = "harness"
name = "Harness"
# "harness" alone is a generic English word (test harness) and would poison
# the tier-3 substring gate; precise aliases trade recall for precision
aliases = ["harness.io", "harness platform", "harness cd", "harness ci"]

[[competitors]]
id = "mlflow"
name = "MLflow"
aliases = ["mlflow"]

# label: analyst-facing display name, read only by the UI; the pipeline
# ignores it.

[[sources]]
id = "sonatype-blog"
label = "Sonatype blog"
provider = "rss"
url = "https://www.sonatype.com/blog/rss.xml"
trust_tier = 1
competitor = "sonatype"

[[sources]]
id = "cloudsmith-blog"
label = "Cloudsmith blog"
provider = "rss"
url = "https://cloudsmith.com/rss/blog.xml"
trust_tier = 1
competitor = "cloudsmith"

[[sources]]
id = "jfrog-blog"
label = "JFrog blog"
provider = "rss"
url = "https://jfrog.com/blog/feed/"
trust_tier = 1
competitor = "jfrog"

[[sources]]
id = "github-changelog"
label = "GitHub changelog"
provider = "rss"
url = "https://github.blog/changelog/feed/"
trust_tier = 2
competitor = "github"

[[sources]]
id = "gitlab-releases"
label = "GitLab releases"
provider = "rss"
url = "https://docs.gitlab.com/releases/all-releases.xml"
trust_tier = 2
competitor = "gitlab"

[[sources]]
id = "snyk-blog"
label = "Snyk blog"
provider = "rss"
url = "https://snyk.io/blog/feed/"
trust_tier = 3
competitor = "snyk"

[[sources]]
id = "releases-nexus-public"
label = "Nexus releases"
provider = "github_releases"
repo = "sonatype/nexus-public"
trust_tier = 1
competitor = "sonatype"

[[sources]]
id = "releases-cloudsmith-cli"
label = "Cloudsmith CLI releases"
provider = "github_releases"
repo = "cloudsmith-io/cloudsmith-cli"
trust_tier = 1
competitor = "cloudsmith"

[[sources]]
id = "harness-blog"
label = "Harness blog"
provider = "rss"
url = "https://www.harness.io/blog/rss.xml"
trust_tier = 1
competitor = "harness"

[[sources]]
id = "releases-mlflow"
label = "MLflow releases"
provider = "github_releases"
repo = "mlflow/mlflow"
trust_tier = 1
competitor = "mlflow"

[[sources]]
id = "newsdata"
label = "Industry news"
provider = "newsdata"
trust_tier = 3
query = "JFrog OR Sonatype OR Cloudsmith OR Artifactory"
