[project]
name = "ci-tool"
version = "0.1.0"
description = "Competitive intelligence pipeline: deterministic ingest, dedup and grounding with a bounded LLM stage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "streamlit>=1.57",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
