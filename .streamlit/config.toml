# JFrog-flavored dark theme: near-black charcoal ground, JFrog green accent.

[client]
# hide the Deploy button and developer menu (rerun/clear cache) for demos
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#40BE46"
backgroundColor = "#0F1113"
secondaryBackgroundColor = "#1A1E20"
codeBackgroundColor = "#15191B"
textColor = "#E6EDF3"
linkColor = "#5BD262"
borderColor = "#2B3134"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
codeTextColor = "#8FE694"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["34px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#40BE46", "#22A0B6", "#69D06E", "#7FB3C8", "#EAB308", "#EF4444", "#8B5CF6"]

grayColor = "#8B98A5"
blueColor = "#4C9FE8"
greenColor = "#40BE46"
redColor = "#EF5350"
yellowColor = "#EAB308"
orangeColor = "#F97316"
violetColor = "#9B7BF0"

dataframeBorderColor = "#2B3134"
dataframeHeaderBackgroundColor = "#1A1E20"

[theme.sidebar]
backgroundColor = "#0A0C0D"
secondaryBackgroundColor = "#1A1E20"
codeBackgroundColor = "#15191B"
textColor = "#E6EDF3"
borderColor = "#2B3134"
primaryColor = "#40BE46"
dataframeHeaderBackgroundColor = "#1A1E20"
dataframeBorderColor = "#2B3134"
